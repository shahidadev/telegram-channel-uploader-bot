services:
  - type: web
    name: telegram-channel-uploader-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MASTER_PASSWORD
        sync: false
      - key: OWNER_ID
        sync: false
      - key: DEFAULT_PREVIEW_MODE
        value: "True"
      - key: WORKER_COUNT
        value: "1"
      - key: MAX_BOT_DOWNLOAD_MB
        value: "20"
      - key: ENABLE_WEB_SERVER
        value: "True"
